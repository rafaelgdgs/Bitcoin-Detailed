[package]
name = "bitcoin-detailed"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
bitcoin = "0.32"
bytemuck = "1"
crossterm = "0.29"
dirs = "6"
futures-lite = "2"
hex = "0.4"
num-bigint = "0.4"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = { version = "0.10", features = ["compress"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
ureq = "3.4"
wgpu = { version = "30", default-features = false, features = ["std", "vulkan", "wgsl"] }
